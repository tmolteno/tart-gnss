[package]
name = "tart-gnss-acquire"
version = "0.3.1"
edition = "2021"
description = "GNSS signal acquisition for the TART radio telescope — GPS L1 C/A, GPS L1C, Galileo E1-C, BeiDou B1C, SBAS, and QZSS"
license = "GPL-3.0"
authors = ["Tim Molteno <tim@elec.ac.nz>"]
repository = "https://github.com/tmolteno/tart-gnss"
exclude = ["data/*", "junk/*", "test.json"]

[dependencies]
hdf5-reader = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rustfft = "6"
num-complex = "0.4"
num-traits = "0.2"
rayon = "1"
