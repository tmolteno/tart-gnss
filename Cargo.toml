[package]
name = "tart-gnss-acquire"
version = "0.1.0"
edition = "2021"
description = "GNSS signal acquisition for the TART radio telescope — GPS L1 C/A, Galileo E1-C, and BeiDou B1C"
license = "MIT"
repository = "https://github.com/tmolteno/tart-gnss"

[dependencies]
hdf5-reader = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rustfft = "6"
num-complex = "0.4"
num-traits = "0.2"
rayon = "1"
